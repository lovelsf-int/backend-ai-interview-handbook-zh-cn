name: Word review skill verification

on:
  push:
    branches:
      - ci/word-review-skill-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused skill contract
        run: node --test tests/word-review-skill.test.mjs

      - name: Run repository checks
        run: npm run check

      - name: Build VitePress site
        run: npm run docs:build
